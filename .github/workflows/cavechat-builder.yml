name: CaveChat builder image

# Builds ONLY the builder (Next.js) image for the CaveChat deploy branch and
# pushes it to GHCR, so the Coolify server just pulls a ready image instead of
# compiling Next.js on the server for ~10 min. Same approach as release.yml
# (buildx, linux/amd64, per-scope gha cache mode=min, swap for the compile).
#
# Deploy after this run is green: Coolify -> CaveChat service -> "Pull latest
# and restart" (builder uses image ghcr.io/teixeiradv/cavechat-builder:caverna,
# pull_policy: always).

on:
  push:
    branches: [caverna]
  workflow_dispatch:

concurrency:
  group: cavechat-builder-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/teixeiradv/cavechat-builder

jobs:
  build:
    name: Build and push builder image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Turbopack's compile peaks near the runner's RAM; extra swap avoids
      # exit 137. Failure only warns (copied from release.yml).
      - name: Add swap for the builder compile
        continue-on-error: true
        run: |
          set -euo pipefail
          swap_gb=16
          reserve_gb=20
          swapfile=""
          for dir in /mnt /; do
            [ -d "$dir" ] || continue
            fstype=$(findmnt -n -o FSTYPE -T "$dir")
            free_gb=$(df -BG --output=avail "$dir" | tail -1 | tr -dc '0-9')
            if [ "$fstype" != "tmpfs" ] && [ "$free_gb" -ge $((swap_gb + reserve_gb)) ]; then
              swapfile="${dir%/}/ci-build.swap"
              break
            fi
          done
          if [ -z "$swapfile" ]; then
            echo "::warning::No disk with room for a ${swap_gb}G swapfile; building without extra swap"
            exit 0
          fi
          sudo fallocate -l "${swap_gb}G" "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          swapon --show
          free -h

      - name: Short SHA
        id: vars
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/builder/docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:caverna
            ${{ env.IMAGE }}:sha-${{ steps.vars.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=cavechat-builder
          cache-to: type=gha,scope=cavechat-builder,mode=min

      - name: Image
        run: |
          echo "Pushed ${IMAGE}:caverna and ${IMAGE}:sha-${{ steps.vars.outputs.short }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Next: Coolify -> CaveChat -> Pull latest and restart" >> "$GITHUB_STEP_SUMMARY"
